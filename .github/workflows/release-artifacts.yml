name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify checked-out release SHA
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Install release-scope dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Project version matches runtime version
        run: |
          python - <<'PY'
          import ast
          import tomllib
          from pathlib import Path

          pyproject_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          module = ast.parse(Path("src/aiyes/__init__.py").read_text())
          runtime_version = None
          for statement in module.body:
              if isinstance(statement, ast.Assign):
                  for target in statement.targets:
                      if isinstance(target, ast.Name) and target.id == "__version__":
                          runtime_version = ast.literal_eval(statement.value)
          if pyproject_version != runtime_version:
              raise SystemExit(
                  f"version mismatch: pyproject={pyproject_version} runtime={runtime_version}"
              )
          PY
      - name: Tag version matches project version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
            test "${{ github.ref_name }}" = "v${PROJECT_VERSION}"
          fi
      - name: Lint
        run: ruff check src/ tests/
      - name: Typecheck
        run: mypy src/aiyes/
      - name: Full tests
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build
      - name: Check distribution
        run: python -m twine check dist/*
      - name: Wheel install and CLI smoke
        run: |
          python -m venv /tmp/aiyes-wheel-smoke
          /tmp/aiyes-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/aiyes-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/aiyes-wheel-smoke/bin/aieyes --help
          /tmp/aiyes-wheel-smoke/bin/aieyes --version
      - name: MCP missing-extra smoke
        run: |
          python -m venv /tmp/aiyes-mcp-missing-extra
          /tmp/aiyes-mcp-missing-extra/bin/python -m pip install --upgrade pip
          /tmp/aiyes-mcp-missing-extra/bin/python -m pip install dist/*.whl
          set +e
          MCP_OUTPUT="$(/tmp/aiyes-mcp-missing-extra/bin/aieyes-mcp 2>&1)"
          MCP_STATUS="$?"
          set -e
          test "$MCP_STATUS" -ne 0
          printf '%s\n' "$MCP_OUTPUT" | grep "requires the 'mcp' package"
      - name: MCP installed-extra smoke
        run: |
          python -m venv /tmp/aiyes-mcp-installed-extra
          /tmp/aiyes-mcp-installed-extra/bin/python -m pip install --upgrade pip
          /tmp/aiyes-mcp-installed-extra/bin/python -m pip install 'dist/'*.whl'[mcp]'
          /tmp/aiyes-mcp-installed-extra/bin/python - <<'PY'
          import aiyes.adapters.mcp_server as mcp_server

          assert mcp_server._MCP_AVAILABLE is True
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiyes-dist
          path: dist/*
          if-no-files-found: error
